name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release --product swiftserve
      - name: Receipt acceptance
        run: make receipt-spike
      - name: Generated site and skill synchronization
        run: make site-check

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment
        run: |
          apt-get update && apt-get install -y make
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release --product swiftserve --static-swift-stdlib
      - name: Receipt acceptance
        run: make receipt-spike
